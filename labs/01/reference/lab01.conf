# 练习 01 的站点配置
#
# 端口选择说明：
#   8080 已被生产站点占用。若也用 8080 且 server_name 相同（_），
#   nginx 会报 "conflicting server name" 并【静默忽略】本配置。
#   因此选用空闲的 8081。
server {
    listen       8081;
    listen       [::]:8081;
    server_name  _;

    root  /srv/www/lab01;
    index index.html;

    access_log /var/log/nginx/lab01.access.log;
    error_log  /var/log/nginx/lab01.error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }
}
