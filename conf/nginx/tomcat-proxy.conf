# ==============================================================================
# Tomcat 反向代理
#
# 作用：把 /app/ 路径的请求转发给 Tomcat（127.0.0.1:8082）
#
# 关键配置说明：
#   1. proxy_pass 末尾的斜杠决定路径拼接方式
#   2. proxy_http_version 1.1 + Connection "" 配合 upstream keepalive
#   3. 限流复用 00-limit-zones.conf 定义的 zone
# ==============================================================================

upstream tomcat_backend {
    server 127.0.0.1:8082;
    keepalive 16;
}

server {
    listen       8083;
    listen       [::]:8083;
    server_name  _;

    access_log  /var/log/nginx/tomcat-proxy.access.log;
    error_log   /var/log/nginx/tomcat-proxy.error.log;

    location /app/ {
        # ── 限流保护 ──
        limit_req  zone=general burst=20 nodelay;
        limit_conn perip 10;

        # ── 反向代理 ──
        # 末尾的斜杠：/app/foo → 后端收到 /foo
        proxy_pass http://tomcat_backend/;

        # ── HTTP/1.1 + 长连接（两者必须成对）──
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # ── 传递真实客户端信息 ──
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── 超时 ──
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # ── 关闭响应缓冲（Java 应用响应通常较小）──
        proxy_buffering off;
    }

    location / {
        root  /var/www/personal-site;
        index index.html;
    }
}
