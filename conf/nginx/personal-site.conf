# 个人站点配置 —— 由 ops-lab 维护
#
# 端口规划：
#   80   域名访问入口（301 跳转到 HTTPS）
#   80   其他 Host（IP 直连等）→ 保持 HTTP 服务
#   443  主服务（HTTPS）
#   8080 IP 备用入口（HTTP）
#
# 共用规则抽到 snippets/site-common.conf，避免重复维护。

# ==============================================================================
# 80 端口：域名访问 → 跳转 HTTPS
# ==============================================================================
server {
    listen       80;
    listen       [::]:80;
    server_name  myzhiwei.xyz www.myzhiwei.xyz;

    # ACME 验证路径必须放行（证书续期时 Let's Encrypt 会来访问）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其他全部跳转到 HTTPS
    # 用 $host 而不是 $server_name，确保 www 访问跳到 www
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# 80 端口：default_server（IP 直连、未知域名）
#
# 为什么保留 HTTP：
#   证书是签发给 myzhiwei.xyz 的。如果用 IP 访问被跳到
#   https://<服务器IP>，浏览器会报证书名称不匹配。
#   所以这个入口保持 HTTP。
# ==============================================================================
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    include /etc/nginx/conf.d/snippets/site-common.conf;
}

# ==============================================================================
# 443 端口：HTTPS 主服务
# ==============================================================================
server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  myzhiwei.xyz www.myzhiwei.xyz;

    # ---- 证书 ----
    ssl_certificate     /etc/letsencrypt/live/myzhiwei.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myzhiwei.xyz/privkey.pem;

    # ---- 协议与加密套件 ----
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # ---- 会话缓存 ----
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- OCSP Stapling：未启用 ----
    # Let's Encrypt 自 2025 年起不再在证书中提供 OCSP Responder URL
    # （改用 CRL 机制），因此 ssl_stapling 不生效且会产生 nginx -t 警告。
    # 移除相关配置，使「配置内容」与「实际行为」一致。

    # ---- HSTS：告诉浏览器一年内只用 HTTPS 访问 ----
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/conf.d/snippets/site-common.conf;
}

# ==============================================================================
# 8080 端口：IP 备用入口（HTTP）
# ==============================================================================
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    include /etc/nginx/conf.d/snippets/site-common.conf;
}
