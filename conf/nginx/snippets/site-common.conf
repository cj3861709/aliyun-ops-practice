# ==============================================================================
# 站点共用配置片段
#
# 被 80/443/8080 三个 server 块 include。
# 修改这里会同时作用于所有端口 —— 这正是抽出来的目的。
# ==============================================================================

root  /var/www/personal-site;
index index.html;

# ---- 日志 ----
access_log /var/log/nginx/personal-site.access.log;
error_log  /var/log/nginx/personal-site.error.log warn;

# ---- 安全响应头 ----
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

server_tokens off;

# ---- 限速与限连 ----
# 取值依据：真人浏览瞬时峰值约 10-20 请求/秒；自动化工具通常 100+ 请求/秒。
limit_req  zone=general burst=20 nodelay;
limit_conn perip 20;

# ---- gzip ----
gzip            on;
gzip_vary       on;
gzip_min_length 256;
gzip_comp_level 5;
gzip_types      text/plain text/css text/xml application/json
                application/javascript application/xml+rss
                image/svg+xml;

# ---- 静态资源缓存 ----
location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
}

# ---- 禁止访问点文件 ----
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

location = /favicon.ico { log_not_found off; access_log off; }
location = /robots.txt  { log_not_found off; access_log off; }
