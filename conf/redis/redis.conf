# ── 网络 ──
bind 0.0.0.0
protected-mode yes
port 6379
timeout 0
tcp-keepalive 300

# ── 认证 ──
requirepass A8Zd2ilyECtRj7glqZVG6CIX

# ── 内存管理 ──
maxmemory 100mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# ── 持久化：AOF ──
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ── 持久化：RDB ──
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# ── 日志 ──
loglevel notice

# ── 慢查询 ──
slowlog-log-slower-than 10000
slowlog-max-len 128
